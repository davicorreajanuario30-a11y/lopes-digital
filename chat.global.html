<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat Global | Lopes Digital</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #1e293b;
    }

    .chat-container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    #mensagens {
      height: 450px;
      overflow-y: auto;
      background: #1e293b;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .mensagem {
      background: #0f172a;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      border-left: 4px solid #22c55e;
    }

    .nome {
      font-weight: bold;
      margin-bottom: 5px;
      color: #60a5fa;
    }

    .enviar-area {
      display: flex;
      gap: 10px;
    }

    .enviar-area input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    .botao-enviar {
      background: #22c55e;
      color: white;
    }

    .aviso {
      text-align: center;
      padding: 10px;
      color: #cbd5e1;
    }
  </style>
</head>

<header>
