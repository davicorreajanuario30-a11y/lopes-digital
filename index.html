<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lopes Digital</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <h1>🚀 Lopes Digital</h1>
    <p>Slides, produtos digitais e serviços online</p>
  </header>


  <!-- ÁREA INICIAL -->
  <main>

    <section id="inicio">

      <h2>Bem-vindo à Lopes Digital 👋</h2>

      <p>
        Crie pedidos, acompanhe seus serviços e conheça nossos produtos.
      </p>

      <button onclick="mostrarLogin()">
        🔐 Entrar
      </button>

      <button onclick="mostrarCadastro()">
        👤 Criar conta
      </button>

    </section>


    <!-- LOGIN -->

    <section id="login" class="pagina escondido">

      <h2>🔐 Entrar</h2>

      <input
        type="email"
        id="emailLogin"
        placeholder="Seu e-mail"
      >

      <input
        type="password"
        id="senhaLogin"
        placeholder="Sua senha"
      >

      <button onclick="entrar()">
        Entrar
      </button>

      <button onclick="voltarInicio()">
        ← Voltar
      </button>

    </section>


    <!-- CADASTRO -->

    <section id="cadastro" class="pagina escondido">

      <h2>👤 Criar conta</h2>

      <input
        type="text"
        id="nomeCadastro"
        placeholder="Seu nome"
      >

      <input
        type="email"
        id="emailCadastro"
        placeholder="Seu e-mail"
      >

      <input
        type="password"
        id="senhaCadastro"
        placeholder="Crie uma senha"
      >

      <button onclick="cadastrar()">
        Criar conta
      </button>

      <button onclick="voltarInicio()">
        ← Voltar
      </button>

    </section>


    <!-- PAINEL -->

    <section id="painel" class="pagina escondido">

      <h2>
        👋 Olá, <span id="nomeUsuario"></span>
      </h2>

      <p>Escolha o que deseja fazer:</p>

      <button onclick="mostrarPedido()">
        📦 Fazer pedido
      </button>

      <button onclick="sair()">
        🚪 Sair
      </button>

    </section>


    <!-- PEDIDO -->

    <section id="pedido" class="pagina escondido">

      <h2>📦 Novo Pedido</h2>

      <input
        type="text"
        id="tema"
        placeholder="Tema do seu slide"
      >

      <textarea
        id="descricao"
        placeholder="Descreva seu pedido"
      ></textarea>

      <button onclick="enviarPedido()">
        🚀 Enviar Pedido
      </button>

      <button onclick="mostrarPainel()">
        ← Voltar
      </button>

    </section>

  </main>


  <footer>
    <p>© 2026 Lopes Digital</p>
  </footer>


  <!-- IMPORTANTE: CARREGA O JAVASCRIPT -->
  <sc<script type="module" src="./app.js"></script>

</body>
        </html>
